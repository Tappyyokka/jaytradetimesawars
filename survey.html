
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Excellence Awards | Nomination Form</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f3f5f9;
            color: #222;
            line-height: 1.6;
        }

        header {
            background: #132b49;
            color: white;
            padding: 22px 8%;
            text-align: center;
        }

        header h2 {
            color: #f3c969;
            font-size: 26px;
        }

        header p {
            font-size: 14px;
            margin-top: 5px;
        }

        .container {
            max-width: 850px;
            margin: 40px auto;
            padding: 35px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 5px 25px #0000000d;
        }

    
header {
    background: white;
    height: 100px;
    padding: 0 8%;
    display: flex;
    align-items: center;
    justify-content: center;
    border-bottom: 1px solid #e8e8e8;
}

.logo {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: var(--navy);
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 1px;
    transform: translateX(-85px);
}

.logo-img {
    width: 300px;
    height: 600px;
    object-fit: contain;
    display: block;
    flex-shrink: 0;
}


        .intro {
            text-align: center;
            margin-bottom: 30px;
        }

        .intro h1 {
            color: #173f75;
            font-size: 30px;
            margin-bottom: 10px;
        }

        .intro p {
            color: #666;
        }

        .section-title {
            color: #173f75;
            font-size: 19px;
            margin: 28px 0 18px;
            padding-bottom: 8px;
            border-bottom: 2px solid #f0c65e;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 7px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d5dbe5;
            border-radius: 7px;
            font-size: 15px;
            font-family: inherit;
            background: white;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #2876c7;
            box-shadow: 0 0 0 3px #2876c71a;
        }

        textarea {
            resize: vertical;
            min-height: 110px;
        }

        .required {
            color: #d93025;
        }

        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin: 25px 0;
            font-size: 14px;
        }

        .checkbox-group input {
            width: auto;
            margin-top: 5px;
        }

        .checkbox-group label {
            font-weight: normal;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: #173f75;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .submit-btn:hover {
            background: #2876c7;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #173f75;
            text-decoration: none;
        }

        .note {
            background: #fff8e6;
            border-left: 4px solid #f0c65e;
            padding: 13px;
            font-size: 13px;
            color: #665322;
            margin-top: 20px;
        }

        footer {
            background: #132b49;
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .container {
                margin: 20px 12px;
                padding: 22px 18px;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .intro h1 {
                font-size: 25px;
            }
        }

        
.nomination-form-section {
    width: 100%;
    padding: 30px 16px 50px;
    box-sizing: border-box;
}

.jotform-container {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    background: #ffffff;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
}

.jotform-container iframe {
    width: 100% !important;
    max-width: 100% !important;
    border: none !important;
}

@media (max-width: 600px) {
    .nomination-form-section {
        padding: 20px 10px 35px;
    }

    .jotform-container {
        border-radius: 8px;
    }
}
    </style>
</head>

<body>

<header>
    
    <p>Business Excellence Awards 2026</p>
    <div class="logo">
    <img src="images/logo.jpg" alt="Organization Logo" class="logo-img">
    <span></span>
</div>
</header>

<main class="container">

    <div class="intro">
        <h1>Nomination Form</h1>
        <p>
            Recognising visionary leaders, outstanding entrepreneurs,
            and exceptional business achievements.
        </p>
    </div>

    
<!-- JOTFORM NOMINATION FORM -->
<section class="nomination-form-section">
    <div class="jotform-container">
        <script
            type="text/javascript"
            src="https://form.jotform.com/jsform/262845318353057">
        </script>
    </div>
</section>

    <a href="index.html" class="back-link">← Back to Program Website</a>

</main>

<footer>
    &copy; 2026 YOUR ORGANIZATION. All rights reserved.
</footer>

<script>
    document.getElementById("nominationForm").addEventListener("submit",
        function(event) {
            event.preventDefault();

            alert(
                "Your form is ready, but submission is not connected yet. " +
                "Please connect a backend or form service to receive nominations."
            );
        }
    );
</script>

</body>
</html>
